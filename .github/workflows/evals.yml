name: Evals

# Runs the skill's claude plugin eval cases on demand. Evals cost model usage,
# so this never runs on push. Windows can't sandbox the Bash tool the skill needs,
# so evals run here, on Linux.

on:
  workflow_dispatch:
    inputs:
      case:
        description: Case name glob (empty runs every case)
        required: false
        default: ""
      runs:
        description: Runs per case
        required: false
        default: "3"
      ablation:
        description: "none, or with-without to add a no-skill baseline"
        required: false
        default: none
        type: choice
        options: [none, with-without]
      traces:
        description: Upload each run's transcript (public artifact, kept 7 days)
        required: false
        default: false
        type: boolean
      model:
        description: Model the agent runs on
        required: false
        default: claude-sonnet-5
        type: choice
        options: [claude-sonnet-5, claude-haiku-4-5-20251001]

permissions:
  contents: read

concurrency:
  group: evals

jobs:
  evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check for a token
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OAUTH" != "true" ] && [ "$HAS_API_KEY" != "true" ]; then
            echo "::error::Add a CLAUDE_CODE_OAUTH_TOKEN (from 'claude setup-token') or ANTHROPIC_API_KEY repository secret."
            exit 1
          fi

      # Pinned so every case in the README table ran on the same Claude Code.
      # Bump it only together with a rerun of every case.
      - name: Install Claude Code and the sandbox backend
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.290
          sudo apt-get update && sudo apt-get install -y bubblewrap socat
          # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASE: ${{ inputs.case }}
          RUNS: ${{ inputs.runs }}
          ABLATION: ${{ inputs.ablation }}
          MODEL: ${{ inputs.model }}
          KEEP_TEMP: ${{ inputs.traces && '1' || '' }}
        run: |
          # Keep only the token that was provided.
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          claude plugin eval . \
            --trust-plugin --scaffold --allow-tools Bash Write Edit \
            --model "$MODEL" --runs "$RUNS" --ablation "$ABLATION" \
            ${CASE:+--case "$CASE"} ${KEEP_TEMP:+--keep-temp} \
            --no-publish --max-cost-usd 20 \
            --json results.json --report report.html

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: |
            results.json
            report.html
          if-no-files-found: ignore

      # Only the out/ folder of a kept run is written by the harness, not the agent.
      - name: Upload transcripts
        if: always() && inputs.traces
        uses: actions/upload-artifact@v7
        with:
          name: eval-transcripts
          path: /tmp/claude-eval-*/out/trace.jsonl
          retention-days: 7
          if-no-files-found: warn
