schema_version: "1.1"
name: mix-volume-float
description: Port a mixer that passes SDL2's 0-128 volumes; SDL3's SDL_MixAudio takes a float from 0 to 1.
tags: [trap]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
  prompt: |
    This is a small SDL2 program. Port it to SDL3.

    SDL3 isn't installed on this machine, so you can't build it here. Do the port anyway, and tell me what you couldn't check.
