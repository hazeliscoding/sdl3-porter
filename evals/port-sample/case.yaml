schema_version: "1.1"
name: port-sample
description: Port the bounce SDL2 sample (CMake, two source files) to SDL3.
tags: [port]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
  prompt: |
    This is a small SDL2 game. Port it to SDL3.

    SDL3 isn't installed on this machine, so you can't build it here. Do the port anyway, and tell me what you couldn't check.
