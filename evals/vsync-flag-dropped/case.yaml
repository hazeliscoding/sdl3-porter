schema_version: "1.1"
name: vsync-flag-dropped
description: Port a frame-paced animation whose renderer asked for vsync with a flag SDL3 removed.
tags: [trap]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 50
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
  prompt: |
    This is a small SDL2 program. Port it to SDL3.

    SDL3 isn't installed on this machine, so you can't build it here. Do the port anyway, and tell me what you couldn't check.
